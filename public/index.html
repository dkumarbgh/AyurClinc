<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clinic Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<!-- ================= LOGIN PAGE ================= -->
<div id="login-page">
  <div class="card login-card">
    <h1>Clinic Manager</h1>
    <p class="tagline">Patients &middot; vaccinations &middot; therapy rooms &middot; fees</p>
    <form id="login-form">
      <div class="form-row">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" autocomplete="username" required />
      </div>
      <div class="form-row">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn" type="submit" style="width:100%; justify-content:center;">Sign in</button>
      <div class="login-error" id="login-error"></div>
    </form>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app-shell" class="hidden">
  <aside class="sidebar">
    <div class="brand">Clinic<span>Manager</span></div>
    <nav id="nav-list">
      <button class="nav-item" data-route="dashboard"><span class="icon">&#9670;</span> Dashboard</button>
      <button class="nav-item" data-route="patients"><span class="icon">&#9737;</span> Patients</button>
      <button class="nav-item" data-route="vaccinations"><span class="icon">&#10010;</span> Vaccinations</button>
      <button class="nav-item" data-route="swarna-prashana"><span class="icon">&#9742;</span> Swarna Prashana</button>
      <button class="nav-item" data-route="rooms"><span class="icon">&#9636;</span> Rooms &amp; Appointments</button>
      <button class="nav-item" data-route="therapists"><span class="icon">&#9781;</span> Therapists</button>
      <button class="nav-item" data-route="fees"><span class="icon">&#8377;</span> Fees</button>
      <button class="nav-item" data-route="whatsapp"><span class="icon">&#9993;</span> WhatsApp Log</button>
      <button class="nav-item" data-route="users" id="nav-users"><span class="icon">&#9776;</span> Users</button>
      <button class="nav-item" data-route="audit-log" id="nav-audit-log"><span class="icon">&#128269;</span> Audit Log</button>
      <button class="nav-item" data-route="settings" id="nav-settings"><span class="icon">&#9881;</span> Settings</button>
    </nav>
    <div class="sidebar-footer">
      <div id="current-user-label">Signed in</div>
      <button id="change-password-btn">Change password</button>
      &middot;
      <button id="logout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div id="view-root"><!-- injected per-route --></div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-host"></div>

<script src="/js/api.js"></script>
<script src="/js/pdf.js"></script>
<script src="/js/app.js"></script>
<script src="/js/views/dashboard.js"></script>
<script src="/js/views/patients.js"></script>
<script src="/js/views/vaccinations.js"></script>
<script src="/js/views/swarnaPrashana.js"></script>
<script src="/js/views/rooms.js"></script>
<script src="/js/views/therapists.js"></script>
<script src="/js/views/fees.js"></script>
<script src="/js/views/whatsapp.js"></script>
<script src="/js/views/users.js"></script>
<script src="/js/views/auditLog.js"></script>
<script src="/js/views/settings.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
